# Opt-in GPU override. Layer it on top of the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Needs an NVIDIA driver + NVIDIA Container Toolkit on the host.
services:
  onnx-lfm-api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    environment:
      # fp16 suits GPUs with tensor cores. On cards without them (e.g. GTX 16xx)
      # fp16 math is slow: set LFM_GPU_QUANT=q4 in ./.env (README, GPU section).
      LFM_QUANT: "${LFM_GPU_QUANT:-fp16}"
      LFM_PROVIDERS: '["CUDAExecutionProvider","CPUExecutionProvider"]'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
