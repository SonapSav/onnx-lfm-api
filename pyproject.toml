[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-lfm-api"
version = "0.1.0"
description = "FastAPI service serving LiquidAI LFM2.5 via ONNX Runtime (CPU)"
requires-python = ">=3.10"
dependencies = [
  "onnxruntime>=1.20",
  "transformers>=4.46",
  "numpy>=1.26",
  "huggingface_hub>=0.26",
  "jinja2>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "requests>=2.31"]
# GPU (NVIDIA/CUDA) runtime. Installing this alongside the base `onnxruntime`
# conflicts — the GPU image uninstalls the CPU build first (see Dockerfile.gpu).
gpu = ["onnxruntime-gpu==1.30.0"]

[project.scripts]
onnx-lfm-api = "onnx_lfm_api.__main__:main"
lfm-chat = "onnx_lfm_api.chat_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["integration: downloads the model and runs real inference (slow)"]
